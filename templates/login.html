<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CyberShield</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="login-page">

    <div class="login-container">

        <div class="brand-icon">
            🛡️
        </div>

        <h1>CyberShield</h1>

        <p class="subtitle">
            AI-Assisted Cybersecurity Incident
            & Risk Management System
        </p>


        <!-- ERROR MESSAGE -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="error-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- LOGIN FORM -->

        <form method="POST">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="admin@cybershield.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Sign In
            </button>

        </form>


        <p class="footer-text">
            Secure • Analyse • Respond
        </p>

    </div>

</body>

</html>
